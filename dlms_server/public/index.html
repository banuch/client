<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AMR meter data: readings, profiles and device logs from the ESP32 meter readers">
  <title>AMR Data</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg width="0" height="0" class="icon-sprite" aria-hidden="true">
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4m0 3v.01"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></symbol>
    <symbol id="i-meter" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8v4H8zM8 15h2m4 0h2"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5 5h14l3 7v7H2v-7z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 0 18 17M20 5v6h-6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></symbol>
  </svg>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><b aria-hidden="true">AMR</b><div><strong>AMR Data</strong><small>Meter readings &amp; device logs</small></div></div>
      <nav class="nav" aria-label="Main">
        <a href="#/home" data-nav="home"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg>Home</a>
        <a href="#/meters" data-nav="meters"><svg class="i" aria-hidden="true"><use href="#i-meter"/></svg>Meters <span id="navAlert" class="count hidden" title="Meters offline or with a failed meter read"></span></a>
      </nav>
      <div class="nav-foot" id="navFoot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn icon-only menu-btn" id="menuButton" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <div class="crumb" id="crumb">Home</div>
        <div class="global-search" id="globalSearch">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="globalSearchInput" type="search" autocomplete="off" placeholder="Find meter: IMEI, serial, manufacturer" aria-label="Find meter" aria-controls="searchResults" aria-expanded="false">
          <div id="searchResults" class="search-results hidden" role="listbox"></div>
        </div>
        <div class="updated" id="updated" role="status" aria-live="polite"></div>
        <button class="btn" id="refreshButton" type="button" title="Reload this page's data"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg><span class="label">Refresh</span></button>
        <button class="btn hidden" id="logoutButton" type="button" title="Sign out of this page"><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg><span class="label">Log out</span></button>
      </header>

      <div class="outdated hidden" id="outdated" role="alert"></div>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="vendor/chart.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
